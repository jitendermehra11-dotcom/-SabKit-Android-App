name: Build SabKit Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK with Wrapper
      run: |
        # find real directory containing settings.gradle or build.gradle (excluding root if empty)
        TARGET_DIR=$(find . -mindepth 2 -name "settings.gradle*" -exec dirname {} \; | head -n 1)
        if [ -z "$TARGET_DIR" ]; then
          TARGET_DIR=$(find . -mindepth 2 -name "build.gradle*" -exec dirname {} \; | head -n 1)
        fi
        if [ -z "$TARGET_DIR" ]; then
          TARGET_DIR="."
        fi
        
        echo "Moving into project directory: $TARGET_DIR"
        cd "$TARGET_DIR"
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SabKit-App-Debug
        path: "**/build/outputs/apk/debug/*.apk"
