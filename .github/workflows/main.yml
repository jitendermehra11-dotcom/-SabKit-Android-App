name: Build SabKit Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        # सब-फ़ोल्डर ढूँढना जहाँ वास्तविक एंड्रॉइड प्रोजेक्ट है
        TARGET_DIR=$(find . -name "build.gradle*" -not -path "*/.*" -exec dirname {} \; | head -n 1)
        echo "Found real Android project at: $TARGET_DIR"
        cd "$TARGET_DIR"

        # प्रॉपर Gradle Wrapper बनाना और बिल्ड करना
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SabKit-App-Debug
        path: "**/build/outputs/apk/debug/*.apk"
