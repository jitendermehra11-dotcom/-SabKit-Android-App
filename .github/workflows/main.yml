name: Build SabKit Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Clean structure and regenerate build setup
      run: |
        # 1. Ensure gradle wrapper exists
        if [ -d "app/gradle" ]; then cp -r app/gradle . ; fi
        if [ -f "app/gradlew" ]; then cp app/gradlew . ; cp app/gradlew.bat . 2>/dev/null || true ; fi

        # 2. Fix Root settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "SabKit-Android-App"
        include(":app")
        EOF

        # 3. Create missing .env and .env.example files for Secrets Plugin
        touch .env .env.example
        touch app/.env app/.env.example

        # 4. Write Corrected app/build.gradle.kts
        cat << 'EOF' > app/build.gradle.kts
        import com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy

        plugins {
          alias(libs.plugins.android.application)
          alias(libs.plugins.kotlin.compose)
          alias(libs.plugins.google.devtools.ksp)
          alias(libs.plugins.secrets)
          alias(libs.plugins.google.services)
        }

        android {
          namespace = "com.example"
          compileSdk = 34

          defaultConfig {
            applicationId = "com.example"
            minSdk = 24
            targetSdk = 34
            versionCode = 3
            versionName = "1.0.2"

            testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
          }

          signingConfigs {
            create("release") {
              val keystorePath = System.getenv("KEYSTORE_PATH") ?: "${rootDir}/my-upload-key.jks"
              storeFile = file(keystorePath)
              storePassword = System.getenv("STORE_PASSWORD")
              keyAlias = "upload"
              keyPassword = System.getenv("KEY_PASSWORD")
            }
            create("debugConfig") {
              storeFile = file("${rootDir}/debug.keystore")
              storePassword = "android"
              keyAlias = "androiddebugkey"
              keyPassword = "android"
            }
          }

          buildTypes {
            release {
              isCrunchPngs = false
              isMinifyEnabled = false
              proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
              signingConfig = signingConfigs.getByName("release")
            }
            debug { signingConfig = signingConfigs.getByName("debugConfig") }
          }
          compileOptions {
            sourceCompatibility = JavaVersion.VERSION_11
            targetCompatibility = JavaVersion.VERSION_11
          }
          buildFeatures {
            compose = true
            buildConfig = true
          }
          testOptions { unitTests { isIncludeAndroidResources = true } }
          dependenciesInfo {
            includeInApk = false
            includeInBundle = true
          }
        }

        secrets {
          propertiesFileName = ".env"
          defaultPropertiesFileName = ".env.example"
          ignoreList.add("FIREBASE_APPCHECK_DEBUG_TOKEN")
        }

        googleServices { missingGoogleServicesStrategy = MissingGoogleServicesStrategy.WARN }

        dependencies {
          implementation(platform(libs.androidx.compose.bom))
          implementation(platform(libs.firebase.bom))
          implementation(libs.androidx.activity.compose)
          implementation(libs.androidx.compose.material.icons.core)
          implementation(libs.androidx.compose.material.icons.extended)
          implementation(libs.androidx.compose.material3)
          implementation(libs.androidx.compose.ui)
          implementation(libs.androidx.compose.ui.graphics)
          implementation(libs.androidx.compose.ui.tooling.preview)
          implementation(libs.androidx.core.ktx)
          implementation(libs.androidx.lifecycle.runtime.compose)
          implementation(libs.androidx.lifecycle.runtime.ktx)
          implementation(libs.androidx.lifecycle.viewmodel.compose)
          implementation(libs.androidx.room.ktx)
          implementation(libs.androidx.room.runtime)
          implementation(libs.converter.moshi)
          implementation(libs.firebase.ai)
          implementation(libs.firebase.appcheck.recaptcha)
          implementation(libs.firebase.appcheck.debug)
          implementation(libs.kotlinx.coroutines.android)
          implementation(libs.kotlinx.coroutines.core)
          implementation(libs.logging.interceptor)
          implementation(libs.moshi.kotlin)
          implementation(libs.okhttp)
          implementation(libs.retrofit)
          implementation("com.google.android.gms:play-services-ads:23.6.0")
          
          testImplementation(libs.androidx.compose.ui.test.junit4)
          testImplementation(libs.androidx.junit)
          testImplementation(libs.junit)
          testImplementation(libs.kotlinx.coroutines.test)
          testImplementation(libs.robolectric)
          
          androidTestImplementation(platform(libs.androidx.compose.bom))
          androidTestImplementation(libs.androidx.compose.ui.test.junit4)
          androidTestImplementation(libs.androidx.espresso.core)
          androidTestImplementation(libs.androidx.junit)
          androidTestImplementation(libs.androidx.runner)
          
          debugImplementation(libs.androidx.compose.ui.test.manifest)
          debugImplementation(libs.androidx.compose.ui.tooling)
          
          ksp(libs.androidx.room.compiler)
          ksp("com.squareup.moshi:moshi-kotlin-codegen:1.15.0")
        }
        EOF

        # 5. Generate Fully Compatible Version Catalog
        mkdir -p gradle
        cat << 'EOF' > gradle/libs.versions.toml
        [versions]
        agp = "8.2.2"
        kotlin = "1.9.22"
        ksp = "1.9.22-1.0.17"
        secrets = "2.0.1"
        googleServices = "4.4.1"
        coreKtx = "1.12.0"
        junit = "4.13.2"
        junitVersion = "1.1.5"
        espressoCore = "3.5.1"
        lifecycleRuntimeKtx = "2.7.0"
        activityCompose = "1.8.2"
        composeBom = "2023.08.00"
        retrofit = "2.9.0"
        okhttp = "4.12.0"
        room = "2.6.1"
        moshi = "1.15.0"
        robolectric = "4.11.1"
        coroutines = "1.7.3"
        firebaseBom = "32.7.2"

        [libraries]
        androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
        junit = { group = "junit", name = "junit", version.ref = "junit" }
        androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
        androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
        androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
        androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
        androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
        androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
        androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
        
        androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
        androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
        androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
        androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
        androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
        androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
        androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
        androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
        androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
        
        androidx-runner = { group = "androidx.test", name = "runner", version = "1.5.2" }

        retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
        converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }
        okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
        logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

        androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
        androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
        androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

        moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }
        robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
        kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
        kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
        kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

        firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
        firebase-ai = { group = "com.google.firebase", name = "firebase-ai", version = "16.0.0-beta01" }
        firebase-appcheck-recaptcha = { group = "com.google.firebase", name = "firebase-appcheck-recaptcha", version = "17.1.2" }
        firebase-appcheck-debug = { group = "com.google.firebase", name = "firebase-appcheck-debug", version = "17.1.2" }

        [plugins]
        android-application = { id = "com.android.application", version.ref = "agp" }
        kotlin-compose = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
        google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
        secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secrets" }
        google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
        EOF

        # 6. Build Debug APK
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SabKit-App-Debug
        path: "**/build/outputs/apk/debug/*.apk"
