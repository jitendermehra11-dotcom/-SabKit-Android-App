name: Build SabKit Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Auto-Restructure Files and Build APK
      run: |
        # 1. अगर gradle/wrapper या gradlew app/ के अंदर है तो उसे बाहर root पर ले आना
        if [ -d "app/gradle" ]; then
          cp -r app/gradle .
        fi
        if [ -f "app/gradlew" ]; then
          cp app/gradlew .
          cp app/gradlew.bat . 2>/dev/null || true
        fi

        # 2. अगर settings.gradle.kts में दिक्कत है तो Root के लिए सही settings बनाना
        echo 'include(":app")' > settings.gradle.kts

        # 3. Wrapper बनाना और APK बिल्ड करना
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SabKit-App-Debug
        path: "**/build/outputs/apk/debug/*.apk"
