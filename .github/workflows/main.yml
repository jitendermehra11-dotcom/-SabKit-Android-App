name: Build SabKit Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Clean structure and Fix Version Catalog
      run: |
        # 1. ensure wrapper exists
        if [ -d "app/gradle" ]; then cp -r app/gradle . ; fi
        if [ -f "app/gradlew" ]; then cp app/gradlew . ; cp app/gradlew.bat . 2>/dev/null || true ; fi

        # 2. Root settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "SabKit-Android-App"
        include(":app")
        EOF

        # 3. Fully Complete Version Catalog File
        mkdir -p gradle
        cat << 'EOF' > gradle/libs.versions.toml
        [versions]
        agp = "8.2.2"
        kotlin = "1.9.22"
        ksp = "1.9.22-1.0.17"
        secrets = "2.0.1"
        googleServices = "4.4.1"
        coreKtx = "1.12.0"
        junit = "4.13.2"
        junitVersion = "1.1.5"
        espressoCore = "3.5.1"
        lifecycleRuntimeKtx = "2.7.0"
        activityCompose = "1.8.2"
        composeBom = "2023.08.00"
        retrofit = "2.9.0"
        okhttp = "4.12.0"
        room = "2.6.1"
        moshi = "1.15.0"
        robolectric = "4.11.1"
        coroutines = "1.7.3"
        firebaseBom = "32.7.2"

        [libraries]
        androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
        junit = { group = "junit", name = "junit", version.ref = "junit" }
        androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
        androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
        androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
        androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
        androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
        androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
        androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
        androidx-ui = { group = "androidx.compose.ui", name = "ui" }
        androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
        androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
        androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
        androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
        androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
        androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
        androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
        androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
        androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.5.2" }

        retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
        converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }
        okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
        logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

        androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
        androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
        androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

        moshi-kotlin-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }
        robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
        kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
        kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
        kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

        firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
        firebase-ai = { group = "com.google.firebase", name = "firebase-ai", version = "16.0.0-beta01" }
        firebase-appcheck-recaptcha = { group = "com.google.firebase", name = "firebase-appcheck-recaptcha", version = "17.1.2" }
        firebase-appcheck-debug = { group = "com.google.firebase", name = "firebase-appcheck-debug", version = "17.1.2" }

        [plugins]
        android-application = { id = "com.android.application", version.ref = "agp" }
        kotlin-compose = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
        google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
        secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secrets" }
        google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
        EOF

        # 4. Generate Wrapper and Build
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SabKit-App-Debug
        path: "**/build/outputs/apk/debug/*.apk"
