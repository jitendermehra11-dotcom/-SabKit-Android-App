name: Build SabKit Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Clean structure and Fix Gradle
      run: |
        # 1. ensure wrapper exists
        if [ -d "app/gradle" ]; then cp -r app/gradle . ; fi
        if [ -f "app/gradlew" ]; then cp app/gradlew . ; cp app/gradlew.bat . 2>/dev/null || true ; fi

        # 2. Fix settings.gradle.kts at Root
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "SabKit-Android-App"
        include(":app")
        EOF

        # 3. Replace plugins with explicit IDs and versions in app/build.gradle.kts
        if [ -f "app/build.gradle.kts" ]; then
          sed -i 's/alias(libs.plugins.android.application)/id("com.android.application") version "8.2.2"/g' app/build.gradle.kts
          sed -i 's/alias(libs.plugins.kotlin.compose)/id("org.jetbrains.kotlin.plugin.compose") version "1.9.22"/g' app/build.gradle.kts
          sed -i 's/alias(libs.plugins.google.devtools.ksp)/id("com.google.devtools.ksp") version "1.9.22-1.0.17"/g' app/build.gradle.kts
          sed -i 's/alias(libs.plugins.secrets)/id("com.google.android.libraries.mapsplatform.secrets-gradle-plugin") version "2.0.1"/g' app/build.gradle.kts
          sed -i 's/alias(libs.plugins.google.services)/id("com.google.gms.google-services") version "4.4.1"/g' app/build.gradle.kts
        fi

        # 4. Generate Wrapper and Build
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SabKit-App-Debug
        path: "**/build/outputs/apk/debug/*.apk"
