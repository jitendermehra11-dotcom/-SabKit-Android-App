name: Build SabKit Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Fix Directory Structure and Clean Build Setup
      run: |
        # 1. Fix nested app directory issue if exists
        if [ -d "app/app" ]; then
          cp -r app/app/* app/ 2>/dev/null || true
          rm -rf app/app
        fi

        # 2. Regenerate fresh Gradle Wrapper files
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew

        # 3. Create Root settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "SabKit-Android-App"
        include(":app")
        EOF

        # 4. Create gradle.properties
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        # 5. Create missing .env files
        touch .env .env.example
        touch app/.env app/.env.example

        # 6. Delete old build.gradle.kts and recreate clean one
        rm -f app/build.gradle.kts
        mkdir -p app

        # 7. Write Corrected app/build.gradle.kts
        cat << 'EOF' > app/build.gradle.kts
        import com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy

        plugins {
          id("com.android.application")
          id("org.jetbrains.kotlin.android")
          id("com.google.devtools.ksp")
          id("com.google.android.libraries.mapsplatform.secrets-gradle-plugin")
          id("com.google.gms.google-services")
        }

        android {
          namespace = "com.example"
          compileSdk = 34

          defaultConfig {
            applicationId = "com.example"
            minSdk = 24
            targetSdk = 34
            versionCode = 3
            versionName = "1.0.2"

            testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
          }

          signingConfigs {
            create("release") {
              val keystorePath = System.getenv("KEYSTORE_PATH") ?: "${rootDir}/my-upload-key.jks"
              storeFile = file(keystorePath)
              storePassword = System.getenv("STORE_PASSWORD")
              keyAlias = "upload"
              keyPassword = System.getenv("KEY_PASSWORD")
            }
            create("debugConfig") {
              storeFile = file("${rootDir}/debug.keystore")
              storePassword = "android"
              keyAlias = "androiddebugkey"
              keyPassword = "android"
            }
          }

          buildTypes {
            release {
              isCrunchPngs = false
              isMinifyEnabled = false
              proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
              signingConfig = signingConfigs.getByName("release")
            }
            debug { signingConfig = signingConfigs.getByName("debugConfig") }
          }
          compileOptions {
            sourceCompatibility = JavaVersion.VERSION_11
            targetCompatibility = JavaVersion.VERSION_11
          }
          buildFeatures {
            compose = true
            buildConfig = true
          }
          composeOptions {
            kotlinCompilerExtensionVersion = "1.5.8"
          }
          testOptions { unitTests { isIncludeAndroidResources = true } }
          dependenciesInfo {
            includeInApk = false
            includeInBundle = true
          }
        }

        secrets {
          propertiesFileName = ".env"
          defaultPropertiesFileName = ".env.example"
          ignoreList.add("FIREBASE_APPCHECK_DEBUG_TOKEN")
        }

        googleServices { missingGoogleServicesStrategy = MissingGoogleServicesStrategy.WARN }

        dependencies {
          val composeBom = platform("androidx.compose:compose-bom:2023.08.00")
          implementation(composeBom)
          androidTestImplementation(composeBom)

          val firebaseBom = platform("com.google.firebase:firebase-bom:32.7.2")
          implementation(firebaseBom)

          implementation("androidx.activity:activity-compose:1.8.2")
          implementation("androidx.compose.material:material-icons-core")
          implementation("androidx.compose.material:material-icons-extended")
          implementation("androidx.compose.material3:material3")
          implementation("androidx.compose.ui:ui")
          implementation("androidx.compose.ui:ui-graphics")
          implementation("androidx.compose.ui:ui-tooling-preview")
          implementation("androidx.core:core-ktx:1.12.0")
          implementation("androidx.lifecycle:lifecycle-runtime-compose:2.7.0")
          implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
          implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
          implementation("androidx.room:room-ktx:2.6.1")
          implementation("androidx.room:room-runtime:2.6.1")
          implementation("com.squareup.retrofit2:converter-moshi:2.9.0")
          implementation("com.google.firebase:firebase-ai:16.0.0-beta01")
          implementation("com.google.firebase:firebase-appcheck-recaptcha:17.1.2")
          implementation("com.google.firebase:firebase-appcheck-debug:17.1.2")
          implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3")
          implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")
          implementation("com.squareup.moshi:moshi-kotlin:1.15.0")
          implementation("com.squareup.okhttp3:okhttp:4.12.0")
          implementation("com.squareup.retrofit2:retrofit:2.9.0")
          implementation("com.google.android.gms:play-services-ads:23.6.0")
          
          testImplementation("androidx.compose.ui:ui-test-junit4")
          testImplementation("androidx.test.ext:junit:1.1.5")
          testImplementation("junit:junit:4.13.2")
          testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3")
          testImplementation("org.robolectric:robolectric:4.11.1")
          
          androidTestImplementation("androidx.compose.ui:ui-test-junit4")
          androidTestImplementation("androidx.test.espresso:espresso-core:3.5.1")
          androidTestImplementation("androidx.test.ext:junit:1.1.5")
          androidTestImplementation("androidx.test:runner:1.5.2")
          
          debugImplementation("androidx.compose.ui:ui-test-manifest")
          debugImplementation("androidx.compose.ui:ui-tooling")
          
          ksp("androidx.room:room-compiler:2.6.1")
          ksp("com.squareup.moshi:moshi-kotlin-codegen:1.15.0")
        }
        EOF

        # 8. Build Debug APK
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SabKit-App-Debug
        path: "**/build/outputs/apk/debug/*.apk"
